# The suite runs on macOS and Ubuntu; the launchd and `say` tests skip off macOS. Nothing here touches a real instance; every test builds its
# own state directory under a temp folder.
name: test
on:
  push:
    branches: [main]
  pull_request:
# The job reads the code and nothing else: no token that can write to the repo.
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      # Actions pinned to a commit, not a tag that can be moved. Bump by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - if: runner.os == 'macOS'
        run: brew install tmux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      # As install.sh and update do it: no dependency runs an install script; our own build runs by name.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      # On ubuntu, systemd-analyze verifies a rendered unit (tests/systemd.test.ts): quoting checked by systemd itself.
      - run: npm test
        env:
          ANGELIA_SYSTEMD_VERIFY: ${{ runner.os == 'Linux' && '1' || '' }}
