# The suite as it runs on the developer's Mac: tmux, launchd guards and the system voice are all
# part of it, so the job runs on macOS. Nothing here touches a real instance; every test builds its
# own state directory under a temp folder.
name: test
on:
  push:
    branches: [main]
  pull_request:
# The job reads the code and nothing else: no token that can write to the repo.
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Actions pinned to a commit, not a tag that can be moved. Bump by hand.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      # As install.sh and update do it: no dependency runs an install script; our own build runs by name.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
