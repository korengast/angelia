<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGETITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{{OGTYPE}}">
<meta property="og:site_name" content="Angelia">
<meta property="og:url" content="{{URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{OGIMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OGALT}}">
<meta name="twitter:card" content="summary_large_image">
<!--ARTICLE-->
<meta name="theme-color" content="#F4EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15100C" media="(prefers-color-scheme: dark)">
<style>
/* A guide page: one article, the landing page's type and colours. Every URL is absolute (it lives under /guides/). */
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/plex-mono-400-italic.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/plex-mono-600.woff2) format('woff2')}
@font-face{font-family:'Italiana';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/italiana-400.woff2) format('woff2')}
:root{--bg:#F4EEE6;--bg-2:#EAE0D3;--fg:#1A120D;--soft:#6E5D50;--rule:#D8CBBB;--accent:#A8474B;--figure:#1A120D;--code-bg:#1A120D;--code-fg:#F1E4D4}
@media (prefers-color-scheme: dark){:root{--bg:#15100C;--bg-2:#1E1712;--fg:#F1E4D4;--soft:#AE9A88;--rule:#3A2D24;--accent:#ECA3A3;--figure:#D06B6B;--code-bg:#0E0A08}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15.5px/1.7 "IBM Plex Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;z-index:10;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;text-decoration:none}
.skip:focus{top:12px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;max-width:1160px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand svg{width:36px;height:36px;color:var(--figure)}
.brand span{font-family:Italiana,serif;font-size:28px;line-height:1}
header nav a{color:var(--fg);text-decoration:none;opacity:.85;margin-left:22px;font-size:14.5px}
article{padding:36px 0 64px}
.meta{color:var(--soft);font-size:13.5px;margin:0 0 8px}
h1{font-weight:600;font-size:clamp(28px,4.4vw,42px);line-height:1.12;letter-spacing:-.03em;margin:0 0 18px}
h2{font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.25;margin:44px 0 12px}
h3{font-weight:600;font-size:17px;margin:28px 0 8px}
p,ul,ol{margin:0 0 16px}
li{margin:0 0 6px}
.lede{font-size:17px}
code{background:var(--bg-2);padding:1px 5px;border-radius:4px;font-size:.92em}
pre{background:var(--code-bg);color:var(--code-fg);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
pre code{background:none;padding:0}
.table{overflow-x:auto;margin:0 0 18px;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--rule)}
th{background:var(--bg-2);font-weight:600}
tr:last-child td{border-bottom:0}
figure{margin:22px 0}
figure img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--rule)}
figcaption{color:var(--soft);font-size:13px;margin-top:6px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--soft)}
.fine{color:var(--soft);font-size:13px}
h2[id]{scroll-margin-top:16px}
figure.video video{display:block;width:100%;height:auto;border-radius:8px;background:#000}
figure.shot{text-align:center}
figure.shot img{width:400px;max-width:100%}
figure.shot figcaption{text-align:left;max-width:520px;margin:6px auto 0}
table{min-width:720px}
/* On a phone the table scrolls sideways under a fixed first column, so each row keeps its name. */
td:first-child,th:first-child{position:sticky;left:0;background:var(--bg);z-index:1;font-weight:600;min-width:120px;box-shadow:1px 0 0 var(--rule)}
th:first-child{background:var(--bg-2)}
@media (max-width:560px){pre{font-size:12.5px;padding:12px}}
footer{border-top:1px solid var(--rule);color:var(--soft);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;padding-bottom:28px;max-width:1160px}
footer a{color:inherit;text-decoration:none}
@media (max-width:560px){header nav a.docs{display:none}header nav a{margin-left:16px}}
header nav a.install-link{background:#D06B6B;color:#1A120D;opacity:1;padding:6px 14px;border-radius:999px;font-weight:600}
.try{margin:40px 0 0;padding:22px 24px 6px;border-radius:12px;background:var(--bg-2)}
.try h2{margin-top:0}
/* The table is wider than a phone: say so, and keep the hint in view while it scrolls. */
.table::before{content:"Swipe sideways for all four columns →";display:none;position:sticky;left:0;padding:8px 11px;font-size:12.5px;color:var(--soft);background:var(--bg-2);border-bottom:1px solid var(--rule)}
@media (max-width:760px){.table::before{display:block}}
</style>
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><!--MARK--></svg>
<header>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Angelia home"><svg><use href="#mark"/></svg><span>Angelia</span></a>
    <nav aria-label="Main"><a href="/guides/">Guides</a><a class="docs" href="https://github.com/{{REPO}}#readme">Docs</a><a href="https://github.com/{{REPO}}">GitHub</a><a class="install-link" href="/#top">Install</a></nav>
  </div>
</header>
<main class="wrap" id="content">
<article>
<p class="meta">{{BYLINE}}</p>
<h1>{{TITLE}}</h1>
<!--BODY-->
</article>
</main>
<footer>
  <div class="wrap">
    <span>Angelia · open source, MIT</span>
    <span><a href="mailto:info@useangelia.com">info@useangelia.com</a> · <a href="https://github.com/{{REPO}}">GitHub</a></span>
  </div>
</footer>
</body>
</html>
